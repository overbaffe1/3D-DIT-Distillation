name: Fetch Baseline and Inspect Data

on:
  push:
    branches:
      - arena/8f28ae4f-3d-dit-distillation
    paths:
      - '.github/scripts/verify_teacher_and_solvers.py'
      - '.github/workflows/fetch_baseline.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/8f28ae4f-3d-dit-distillation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch numpy && pip install remotezip requests

      - name: Run teacher verification and solver benchmark
        run: python -u .github/scripts/verify_teacher_and_solvers.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetched_info
          git status
          if ! git diff --cached --quiet; then
            git commit -m "chore: save teacher weight stats and solver benchmark results"
            git push origin arena/8f28ae4f-3d-dit-distillation
          fi
